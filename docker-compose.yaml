services:
  db-pg:
    container_name: db-pg-1.0.0
    image: bitnami/postgresql:latest
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=docker-user
      - POSTGRES_PASSWORD=docker-password
      - POSTGRES_DB=orders

  roboshop-api:
    container_name: roboshop-api
    build:
      context: .
    ports:
      - 3333:3333
    depends_on:
      - db-pg
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3333
